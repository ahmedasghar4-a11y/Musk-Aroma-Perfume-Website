<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="cart-sidebar-styles.css">
</head>

<body>

    <div class="cart-sidebar">
        <button class="close-btn" onclick="closeCart()">Close</button>
        <h2>Your Shopping Cart</h2>
        <div id="cartItemsContainer" class="cart-items-container">
            <!-- Cart items will be dynamically inserted here -->
        </div>
        <div id="cartTotal" class="cart-total">
            <!-- Cart total will be dynamically inserted here -->
        </div>
        <button onclick="checkout()">Checkout</button>
    </div>

    <script>
        // Function to close the cart sidebar
        function closeCart() {
            document.querySelector('.cart-sidebar').style.display = 'none';
        }

        // Function to display cart items and total
        function displayCart(items, total) {
            const cartItemsContainer = document.getElementById('cartItemsContainer');
            const cartTotalContainer = document.getElementById('cartTotal');

            // Clear existing content
            cartItemsContainer.innerHTML = '';

            // Display each item in the cart
            items.forEach(item => {
                const itemElement = document.createElement('div');
                itemElement.textContent = `${item.name} - £${item.price.toFixed(2)}`;
                cartItemsContainer.appendChild(itemElement);
            });

            // Display cart total
            cartTotalContainer.textContent = `Total: £${total.toFixed(2)}`;

            // Show the cart sidebar
            document.querySelector('.cart-sidebar').style.display = 'block';
        }

        // Simulated cart items and total (for demonstration)
        const cartItems = [
            { name: 'Product 1', price: 19.99 },
            { name: 'Product 2', price: 29.99 },
            { name: 'Product 3', price: 14.99 }
        ];
        const cartTotal = cartItems.reduce((total, item) => total + item.price, 0);

        // Display cart when the page loads (for demonstration)
        displayCart(cartItems, cartTotal);

        // Function to simulate checkout action
        function checkout() {
            alert('Redirecting to checkout page...');
            // Implement your checkout logic here (e.g., redirect to checkout page)
            // window.location.href = 'checkout.html';
        }
    </script>

</body>

</html>
